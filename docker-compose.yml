# Local development and evaluation stack: five infrastructure containers and the ten applications.
#
# Image tags are pinned to exact versions rather than `latest`, so that a rebuild months from now
# produces the stack this phase was verified against.

name: c17-task-document-platform

x-service-base: &service-base
  build:
    context: .
    dockerfile: backend/infra/Dockerfile
  restart: unless-stopped
  environment: &service-env
    NODE_ENV: ${NODE_ENV:-development}
    LOG_LEVEL: ${LOG_LEVEL:-info}
    JWT_SECRET: ${JWT_SECRET:-dev-secret-min-32-chars-required-000000}
    JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-1800}
    RABBITMQ_URL: amqp://${RABBITMQ_USER:-c17}:${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD}@rabbitmq:5672
    MESSAGING_IN_MEMORY: "false"
  depends_on: &rabbitmq-dependency
    rabbitmq:
      condition: service_healthy
  healthcheck: &app-healthcheck
    test:
      [
        "CMD-SHELL",
        'node -e "fetch(''http://127.0.0.1:'' + process.env.PORT + ''/health'').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"',
      ]
    interval: 15s
    timeout: 10s
    retries: 10
    start_period: 30s

services:
  # ---------------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------------

  postgres:
    image: postgres:16.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-c17}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-c17}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # One database per owning service (V3 §7). Runs only on first initialisation.
      - ./infra/postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-c17}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4.7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13.7-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-c17}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 10s
      retries: 10

  clamav:
    image: clamav/clamav:1.4.5
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CLAMAV_PORT:-3310}:3310"
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 20s
      start_period: 300s
      retries: 10

  # ---------------------------------------------------------------------------
  # Applications (V3 §3) — ten independently deployable containers
  # ---------------------------------------------------------------------------

  api-gateway:
    <<: *service-base
    build:
      context: .
      dockerfile: backend/infra/Dockerfile
      args:
        APP: api-gateway
    environment:
      <<: *service-env
      PORT: 3000
      AUTH_SERVICE_URL: http://authentication-identity-service:3001
      USER_ROLE_SERVICE_URL: http://user-role-management-service:3002
      TASK_SERVICE_URL: http://task-management-service:3003
      DOCUMENT_SERVICE_URL: http://document-management-service:3004
      DOCUMENT_SECURITY_SERVICE_URL: http://document-security-service:3005
      PERMISSION_SERVICE_URL: http://permission-service:3006
      AUDIT_SERVICE_URL: http://audit-log-service:3007
      NOTIFICATION_SERVICE_URL: http://notification-service:3008
      SECURITY_MONITORING_SERVICE_URL: http://security-monitoring-service:3009
    depends_on:
      authentication-identity-service:
        condition: service_healthy
      user-role-management-service:
        condition: service_healthy
      task-management-service:
        condition: service_healthy
      document-management-service:
        condition: service_healthy
      document-security-service:
        condition: service_healthy
      permission-service:
        condition: service_healthy
      audit-log-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      security-monitoring-service:
        condition: service_healthy
    ports:
      - "3000:3000"

  authentication-identity-service:
    <<: *service-base
    build:
      context: .
      dockerfile: backend/infra/Dockerfile
      args:
        APP: authentication-identity-service
    environment:
      <<: *service-env
      PORT: 3001
      AUTH_DATABASE_URL: postgresql://${POSTGRES_USER:-c17}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/auth_db
      REDIS_URL: redis://redis:6379
    depends_on:
      <<: *rabbitmq-dependency
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:3001:3001"

  user-role-management-service:
    <<: *service-base
    build:
      context: .
      dockerfile: backend/infra/Dockerfile
      args:
        APP: user-role-management-service
    environment:
      <<: *service-env
      PORT: 3002
      USER_ROLE_DATABASE_URL: postgresql://${POSTGRES_USER:-c17}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/user_role_db
    depends_on:
      <<: *rabbitmq-dependency
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3002:3002"

  task-management-service:
    <<: *service-base
    build:
      context: .
      dockerfile: backend/infra/Dockerfile
      args:
        APP: task-management-service
    environment:
      <<: *service-env
      PORT: 3003
      TASK_DATABASE_URL: postgresql://${POSTGRES_USER:-c17}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/task_db
      PERMISSION_SERVICE_URL: http://permission-service:3006
      AUDIT_SERVICE_URL: http://audit-log-service:3007
      PERMISSION_CHECK_TIMEOUT_MS: ${PERMISSION_CHECK_TIMEOUT_MS:-2000}
      AUDIT_TIMEOUT_MS: ${AUDIT_TIMEOUT_MS:-2000}
    depends_on:
      <<: *rabbitmq-dependency
      postgres:
        condition: service_healthy
      permission-service:
        condition: service_healthy
      audit-log-service:
        condition: service_healthy
    ports:
      - "127.0.0.1:3003:3003"

  document-management-service:
    <<: *service-base
    build:
      context: .
      dockerfile: backend/infra/Dockerfile
      args:
        APP: document-management-service
    environment:
      <<: *service-env
      PORT: 3004
      DOCUMENT_DATABASE_URL: postgresql://${POSTGRES_USER:-c17}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/document_db
      PERMISSION_SERVICE_URL: http://permission-service:3006
      AUDIT_SERVICE_URL: http://audit-log-service:3007
      DOCUMENT_SECURITY_URL: http://document-security-service:3005
      PERMISSION_CHECK_TIMEOUT_MS: ${PERMISSION_CHECK_TIMEOUT_MS:-2000}
      AUDIT_TIMEOUT_MS: ${AUDIT_TIMEOUT_MS:-2000}
      SECURITY_TIMEOUT_MS: ${SECURITY_TIMEOUT_MS:-5000}
    depends_on:
      <<: *rabbitmq-dependency
      postgres:
        condition: service_healthy
      permission-service:
        condition: service_healthy
      audit-log-service:
        condition: service_healthy
      document-security-service:
        condition: service_healthy
    ports:
      - "127.0.0.1:3004:3004"

  document-security-service:
    <<: *service-base
    build:
      context: .
      dockerfile: backend/infra/Dockerfile
      args:
        APP: document-security-service
    environment:
      <<: *service-env
      PORT: 3005
      DOCUMENT_SECURITY_DATABASE_URL: postgresql://${POSTGRES_USER:-c17}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/document_security_db
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY}
      MINIO_USE_SSL: "false"
      MINIO_BUCKET: ${MINIO_BUCKET:-documents}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      CLAMAV_TIMEOUT_MS: ${CLAMAV_TIMEOUT_MS:-10000}
      DOCUMENT_ACTIVE_KEK_VERSION: ${DOCUMENT_ACTIVE_KEK_VERSION:-1}
      DOCUMENT_KEK_V1: ${DOCUMENT_KEK_V1:-replace-me-local-only}
      DOCUMENT_SIGNATURE_KEY: ${DOCUMENT_SIGNATURE_KEY:-replace-me-local-only}
    depends_on:
      <<: *rabbitmq-dependency
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      clamav:
        condition: service_healthy
    ports:
      - "127.0.0.1:3005:3005"

  permission-service:
    <<: *service-base
    build:
      context: .
      dockerfile: backend/infra/Dockerfile
      args:
        APP: permission-service
    environment:
      <<: *service-env
      PORT: 3006
      PERMISSION_DATABASE_URL: postgresql://${POSTGRES_USER:-c17}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/permission_db
    depends_on:
      <<: *rabbitmq-dependency
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3006:3006"

  # Runs at exactly one replica. The audit chain has a single writer by design (V3 §5.7.1,
  # ADR-0002); a second replica would fork it. Do not scale this service.
  audit-log-service:
    <<: *service-base
    build:
      context: .
      dockerfile: backend/infra/Dockerfile
      args:
        APP: audit-log-service
    environment:
      <<: *service-env
      PORT: 3007
      AUDIT_DATABASE_URL: postgresql://${POSTGRES_USER:-c17}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/audit_db
    depends_on:
      <<: *rabbitmq-dependency
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3007:3007"
    deploy:
      replicas: 1

  notification-service:
    <<: *service-base
    build:
      context: .
      dockerfile: backend/infra/Dockerfile
      args:
        APP: notification-service
    environment:
      <<: *service-env
      PORT: 3008
      NOTIFICATION_DATABASE_URL: postgresql://${POSTGRES_USER:-c17}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/notification_db
    depends_on:
      <<: *rabbitmq-dependency
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3008:3008"

  security-monitoring-service:
    <<: *service-base
    build:
      context: .
      dockerfile: backend/infra/Dockerfile
      args:
        APP: security-monitoring-service
    environment:
      <<: *service-env
      PORT: 3009
      SECURITY_MONITORING_DATABASE_URL: postgresql://${POSTGRES_USER:-c17}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/security_monitoring_db
    depends_on:
      <<: *rabbitmq-dependency
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3009:3009"

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  minio-data:
  clamav-data:
